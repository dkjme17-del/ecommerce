# DKmarket — reverse proxy nginx (instance AWS EC2)
# A installer dans /etc/nginx/sites-available/dkmarket puis activer :
#   sudo ln -s /etc/nginx/sites-available/dkmarket /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Repertoire de jetons ACME (necessaire si un nom de domaine est ajoute
    # plus tard avec certbot --webroot). Doit exister et etre accessible a nginx.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Limite Express : 10 Mo par fichier. On laisse un peu de marge.
    client_max_body_size 12m;
    client_body_timeout 60s;

    access_log /var/log/nginx/dkmarket.access.log;
    error_log  /var/log/nginx/dkmarket.error.log warn;

    # En-tetes de securite (lefrontal Next.js ne les pose pas lui-meme).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Tout passe par le conteneur frontend, y compris /api et /uploads :
    # next.config.mjs les relaie vers http://backend:4000 sur le reseau Docker.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Reponses streamables (Next.js) : pas de double tampon ni copie disque.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}